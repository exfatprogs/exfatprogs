name: C/C++ CI

on:
  push:
    branches:
      - master
      - exfat-next
    paths-ignore:
      - 'manpages/**'
      - '**.md'
      - '**.txt'
      - '.editorconfig'
      - '.gitignore'
      - 'COPYING'
      - 'NEWS'
  pull_request:
    branches:
      - master
      - exfat-next

env:
  TEST_PART_TYPES: mbr gpt
# FIXME
#
# As of writing of this, qemu-img does not support VHDX images whose block size
# is other than 512. There's no other versatile util that can be used to create
# 4096-BS VHDX
  TEST_BLOCKSIZES: 512
  # As of writing, the largest HDD on the market was 36TB
  TEST_VOLUMESIZES: |
    7M 128M 256M 512M
    2G 3G 4G 5G 7G 32G 64G 128G 256G 512G
    1T 2T 3T 4T 6T 8T 16T 32T 44T 64T

  UTIL_LINUX_TARBALL: util-linux-2.42.tar.xz
  UTIL_LINUX_SRC: https://www.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.tar.xz
  # xfstests generic/740 equiv
  FOREIGN_FS: |
    (
      "mkfs.exfat img"
      "mkfs.fat img"
      "mkfs.ext4 img"
      "mkfs.btrfs img"
      "mkfs.f2fs img"
      "mkfs.ntfs -QF img"
      "mkfs.xfs img"
      "echo -e 'YES\n1234' | cryptsetup luksFormat --force-password img"
      "parted img mkt msdos"
      "parted img mkt gpt"
    )
  MKFS_INVAR_SERIAL: '0xdeadbeef'
  MKFS_INVAR_PART_GUID: b1083784-c8ff-4ac1-a298-8328a05cc10b
  MKFS_INVAR_DISK_GUID: 1c75d565-b6b8-4d30-aea4-401d588e85e1

jobs:
  memcheck:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        cc: [clang, gcc]
    steps:
    - uses: actions/checkout@v6
    - name: Install packages
      run: |
        sudo apt-get --update --quiet --yes install \
             linux-headers-$(uname -r) xz-utils \
             valgrind libblkid-dev ${{ matrix.cc }}
    - name: Build
      run: |
        export "CC=${{ matrix.cc }}"
        ./autogen.sh && ./configure --enable-tests
        make -j "$(nproc)"
        sudo make install
    - name: Run internal tests with Valgrind
      run: |
        set -e
        pushd ./lib/tests
        TEST_PREOP="valgrind --error-exitcode=1" ./run-all.sh
        popd
    - name: Run fsck with Valgrind
      run: |
        pushd tests
        sudo \
          FSCK1="valgrind --error-exitcode=1 ../fsck/fsck.exfat" \
          FSCK2="valgrind --error-exitcode=1 ../fsck/fsck.exfat" \
            ./test_fsck.sh
        popd
    - name: Run the rest with Valgrind
      shell: bash
      run: |
        set -e

        EXFAT_MKFS="$(realpath ./mkfs/mkfs.exfat)"
        EXFAT_FSCK="$(realpath ./fsck/fsck.exfat)"
        EXFAT_DUMP="$(realpath ./dump/dump.exfat)"

        # cd to tmp dir as the rootfs the runner is running in might not support LFS
        pushd "$(mktemp -d -p /dev/shm)"
        TMP_DIR="$(pwd)"
        CWD_FSTYPE="$(stat -fc '%T' .)"

        # assert that cwd is indeed tmpfs
        if [ "$CWD_FSTYPE" != "tmpfs" ]
        then
          echo "FSTYPE of temp dir: ${CWD_FSTYPE}!" >&2
          exit 1
        fi

        for pt in none mbr gpt
        do
          for bs in 512 4096
          do
            for vs in $TEST_VOLUMESIZES
            do
              echo "========== $pt $bs $vs =========="
              truncate -s 0 img && truncate -s "$vs" img
              img_size="$(stat -c '%s' img)"

              if [ "$bs" -gt 512 ] && [ "$img_size" -lt 134217728 ]
              then
                continue
              fi

              sudo losetup -Pb "$bs" /dev/loop22 img

              if [ "$pt" == "mbr" ] && [ "$img_size" -ge 2199023255552 ]
              then
                set +e
                sudo valgrind --error-exitcode=32 "$EXFAT_MKFS" "-fP$pt" /dev/loop22
                [ $? -eq 32 ] && exit 1 || true
                sudo valgrind --error-exitcode=32 "$EXFAT_MKFS" "-fCP$pt" /dev/loop22
                [ $? -eq 32 ] && exit 1 || true
                set -e
              else
                if [ "$img_size" -le 536870912 ]
                then
                  sudo valgrind --error-exitcode=1 "$EXFAT_MKFS" "-fP$pt" /dev/loop22
                  sudo valgrind --error-exitcode=1 "$EXFAT_MKFS" "-fCP$pt" /dev/loop22
                fi
                sudo valgrind --error-exitcode=1 "$EXFAT_MKFS" "-P$pt" /dev/loop22
                sudo valgrind --error-exitcode=1 "$EXFAT_MKFS" "-CP$pt" /dev/loop22

                if [ "$pt" == none ]
                then
                  loop=/dev/loop22
                else
                  loop=/dev/loop22p1
                fi

                sudo valgrind --error-exitcode=1 "$EXFAT_DUMP" "$loop"
                sudo valgrind --error-exitcode=1 "$EXFAT_FSCK" "$loop"
              fi

              sudo losetup -d /dev/loop22
            done
          done
        done

        popd
        rm -rf "$TMP_DIR"
  tests:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: sparc64-linux-gnu
            qemu: qemu-system-sparc
            gcc:  gcc-sparc64-linux-gnu
            run:  qemu-sparc64
            name: sparc
          - host: x86_64-linux-gnu
            qemu: qemu-system-x86
            gcc:  gcc-x86-64-linux-gnu
            run:  qemu-x86_64
            name: x86_64
          - host: i686-linux-gnu
            qemu: qemu-system-x86
            gcc:  gcc-i686-linux-gnu
            run:  qemu-i386
            name: i686
    steps:
    - name: Install packages
      run: |
        sudo apt-get --update --quiet --yes install \
             linux-headers-$(uname -r) xz-utils curl \
             cryptsetup parted dosfstools e2fsprogs btrfs-progs f2fs-tools ntfs-3g xfsprogs \
             ${{ matrix.gcc }} ${{ matrix.qemu }} \
             qemu-user
        export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
        export PATH=/usr/local/lib:$PATH

    - name: Retrieve util-linux tarball from cache
      uses: actions/cache/restore@v6
      id: restore-util-linux-tarball
      with:
        path: ${{ env.UTIL_LINUX_TARBALL }}
        key: tarball-${{ env.UTIL_LINUX_TARBALL }}
    - name: Download util-linux tarball
      if: steps.restore-util-linux-tarball.outputs.cache-hit != 'true'
      run: curl -L -o "$UTIL_LINUX_TARBALL" "$UTIL_LINUX_SRC"
    - name: Save util-linux tarball from cache
      uses: actions/cache/save@v6
      if: steps.restore-util-linux-tarball.outputs.cache-hit != 'true'
      with:
        path: ${{ env.UTIL_LINUX_TARBALL }}
        key: tarball-${{ env.UTIL_LINUX_TARBALL }}

    - name: Build libblkid
      shell: bash
      run: |
        set -e
        tar xf "${{ env.UTIL_LINUX_TARBALL }}"
        pushd util-linux-*/

        ./configure --host=${{ matrix.host }} --prefix=/usr/${{ matrix.host }}/local \
          --disable-shared --enable-static --disable-all-programs --enable-libblkid
        make -j$((`nproc`+1))
        sudo make -j$((`nproc`+1)) install
        make -j$((`nproc`+1)) distclean

        ./configure --disable-all-programs --enable-libblkid
        make -j$((`nproc`+1))
        sudo make -j$((`nproc`+1)) install

        rm -rf "$(realpath .)"
        popd
    - uses: actions/checkout@v6
    - name: Bootstrap build system
      run: ./autogen.sh
    - name: Test building exfatprogs on arbitrary directory
      shell: bash
      run: |
        set -e
        CONFIG_SCRIPT="$(realpath ./configure)"

        pushd "$(mktemp -d)"
        BUILD_DIR="$(pwd)"
        "${CONFIG_SCRIPT}"
        make -j$((`nproc`+1))
        sudo make check install
        popd

        rm -rf "$BUILD_DIR"
    - name: Build exfatprogs for test target
      env:
        CFLAGS: --static
        PKG_CONFIG_PATH: /usr/${{ matrix.host }}/local/lib/pkgconfig
      run: |
        ./configure --host=${{ matrix.host }} --enable-tests
        make -j$((`nproc`+1))

    - name: Run internal tests
      run: |
        set -e
        pushd ./lib/tests
        ./run-all.sh
        popd

    - name: Test foreign filesystem detection
      env:
        EXFAT_TTY_OVERRIDE: 1
      shell: bash
      run: |
        set -e

        EXFAT_MKFS="$(realpath ./mkfs/mkfs.exfat)"

        pushd "$(mktemp -d)"

        declare -a arr=${{ env.FOREIGN_FS }}
        for fs_cmd in "${arr[@]}"
        do
          truncate -s 0 img && truncate -s 1G img
          echo === $fs_cmd ===
          eval $fs_cmd

          if "$EXFAT_MKFS" img
          then
            echo "mkfs.exfat overwrote existing fs !!!" >&2
            exit 1
          fi
        done

        rm -rf "$(realpath .)"
        popd

# If run without -i, --disk-guid or --part-guid, mkfs.exfat must always create
# randomly generated volume serial and GUIDs
    - name: test mkfs RNG entropy
      run: |
        set -e

        EXFAT_MKFS="$(realpath ./mkfs/mkfs.exfat)"

        TMPDIR="$(mktemp -d)"
        pushd "$TMPDIR"

        rm -f a.img b.img
        truncate -s 256M a.img
        truncate -s 256M b.img
        "$EXFAT_MKFS" -F -Pnone a.img
        "$EXFAT_MKFS" -F -Pnone b.img
        if diff a.img b.img
        then
          echo "mkfs.exfat generated the same volume serial !!!" >&2
          exit 1
        fi

        rm -f a.img b.img
        truncate -s 256M a.img
        truncate -s 256M b.img
        "$EXFAT_MKFS" -F -Pgpt -i 0x12345678 a.img
        "$EXFAT_MKFS" -F -Pgpt -i 0x12345678 b.img
        if diff a.img b.img
        then
          echo "mkfs.exfat generated the same GUIDs !!!" >&2
          exit 1
        fi

        popd
        rm -rf "$TMPDIR"

    - name: run fsck repair testcases
      run: |
        pushd tests
        sudo FSCK1="${{ matrix.run }} ../fsck/fsck.exfat" FSCK2="fsck.exfat" ./test_fsck.sh
        sudo FSCK1="fsck.exfat" FSCK2="${{ matrix.run }} ../fsck/fsck.exfat" ./test_fsck.sh
        popd
    - name: dentry creation/deletion stress test
      shell: bash
      run: |
        set -e
        sudo modprobe exfat
        sudo mkdir -p /mnt/test
        truncate -s 10G test.img
        sudo losetup /dev/loop22 test.img
        sudo ${{ matrix.run }} ./mkfs/mkfs.exfat -vfC /dev/loop22
        sudo mount -t exfat /dev/loop22 /mnt/test/
        pushd /mnt/test/
        cat << EOF | sudo bash
          set -e

          for (( i = 0; i < 10000; i++ ))
          do
            touch file\$i
          done
          sync
          find -mindepth 1 -delete
          for (( i = 0; i < 10000; i++ ))
          do
            mkdir dir\$i
          done
          sync
          find -mindepth 1 -delete

          for (( i = 0; i < 10000; i++ ))
          do
            touch file\$i
          done
          for (( i = 0; i < 10000; i++ ))
          do
            mkdir dir\$i
          done
          sync
        EOF
        popd
        sudo ${{ matrix.run }} ./fsck/fsck.exfat /dev/loop22
        sudo find /mnt/test/ -mindepth 1 -delete
        sudo umount /mnt/test/
        sudo ${{ matrix.run }} ./fsck/fsck.exfat /dev/loop22
        sudo losetup -d /dev/loop22
        rm -f test.img

    - name: generate large images for Windows runners
      shell: bash
      id: images
      run: |
        set -e

        EXFAT_MKFS="$(realpath ./mkfs/mkfs.exfat)"
        EXFAT_FSCK="$(realpath ./fsck/fsck.exfat)"
        EXFAT_DUMP="$(realpath ./dump/dump.exfat)"

        # cd to tmp dir as the rootfs the runner is running in might not support LFS
        pushd "$(mktemp -d -p /dev/shm)"
        CWD_FSTYPE="$(stat -fc '%T' .)"

        # assert that cwd is indeed tmpfs
        if [ "$CWD_FSTYPE" != "tmpfs" ]
        then
          echo "FSTYPE of temp dir: ${CWD_FSTYPE}!" >&2
          exit 1
        fi

        mkdir "images-${{ matrix.name }}" && pushd "images-${{ matrix.name }}"
        for pt in $TEST_PART_TYPES
        do
          mkdir "$pt" && pushd "$pt"

          for bs in $TEST_BLOCKSIZES
          do
            mkdir "$bs" && pushd "$bs"

            for vs in $TEST_VOLUMESIZES
            do
              img_raw="exfat-$vs.img"

              # truncate up to the volume size
              truncate -s "$vs" "$img_raw"
              img_size="$(stat -c '%s' "$img_raw")"
              if [ "$pt" == "mbr" ] && [ "$img_size" -ge 2199023255552 ]
              then
                expected=false
              else
                expected=true
              fi
              echo "========== $pt $img_size expected to succeed: $expected =========="

              sudo losetup -Pb "$bs" /dev/loop22 "$img_raw"
              sudo blockdev --report /dev/loop22
              if sudo ${{ matrix.run }} "$EXFAT_MKFS" -v \
                -P$pt \
                -i "$MKFS_INVAR_SERIAL" \
                --part-guid="$MKFS_INVAR_PART_GUID" \
                --disk-guid="$MKFS_INVAR_DISK_GUID" \
                  /dev/loop22
              then
                if ! "$expected"
                then
                  # MBR created on 2TiB or larger. This shouldn't happen.
                  echo "MBR created on $img_size bytes device" >&2
                  exit 1
                fi
              elif ! "$expected"
              then
                sudo losetup -d /dev/loop22
                rm -f "$img_raw"
                continue
              else
                exit 1
              fi

              sudo blockdev --report /dev/loop22*
              sudo ${{ matrix.run }} "$EXFAT_FSCK" /dev/loop22p1
              sudo ${{ matrix.run }} "$EXFAT_DUMP" /dev/loop22p1 | grep -iE 'Bytes per Sector:(\s+)?'"$bs" > /dev/null
              sudo losetup -d /dev/loop22
            done
            popd
          done
          popd
        done
        popd

        du -hs "images-${{ matrix.name }}"
        tar -Scf "images-${{ matrix.name }}.tar" "images-${{ matrix.name }}"
        TAR_FILE="$(realpath "images-${{ matrix.name }}.tar")"
        popd

        mv -f "$TAR_FILE" .
    - name: Stage image bundle as artifact
      uses: actions/upload-artifact@v7
      with:
        name: images-${{ matrix.name }}.tar
        path: images-${{ matrix.name }}.tar

# Images generated by different targets should be exactly the same, given that
# the same volume serial and the GUIDs are used. If not, it's indicative of
# endianness or integer width confusion.
#
# After confirming that the contents of the images are same, compare them
# against the cached images if exists. Fire up the Windows runners only when the
# generated images are different.
  check-images:
    name: Compare and consolidate generated images
    needs: tests
    runs-on: "ubuntu-26.04"
    env:
      TARGETS: sparc i686 x86_64
    outputs:
      mkfs_differ: ${{ steps.diff.outputs.result }}
    steps:
    - name: Install packages
      run: sudo apt-get --update --quiet --yes install qemu-utils
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        pattern: images-*.tar
        merge-multiple: true
    - name: Retrieve cached images from cache
      uses: actions/cache/restore@v6
      id: restore-images
      with:
        path: images-raw.cached.tar
        # This is only a placeholder. No cache with this key will be actually created
        key: images-raw.cached.tar-
        restore-keys: images-raw.cached.tar-
    - name: diff images and re-tar
      id: diff
      run: |
        set -e
        DL_DIR="$(realpath .)"
        FIRST_TARGET=""
        DIFF_SCRIPT="$(realpath ./scripts/diff-images.py)"
        if [ -f "images-raw.cached.tar" ]
        then
          CACHED_IMG="$(realpath images-raw.cached.tar)"
        else
          CACHED_IMG=""
        fi
        RESULT=true

        # cd to tmp dir as the rootfs the runner is running in might not support LFS
        pushd "$(mktemp -d -p /dev/shm)"

          # diff images from target platforms

          for t in $TARGETS
          do
            tar -Sxf "$DL_DIR"/images-"$t".tar
            if [ -z "$FIRST_TARGET" ]
            then
              FIRST_TARGET="$t"
            fi
          done

          for t in $TARGETS
          do
            if [ "$FIRST_TARGET" = "$t" ]
            then
              continue
            fi

            "$DIFF_SCRIPT" "images-$FIRST_TARGET" "images-$t"
          done

          # re-tar the consolidated raw images

          mv "images-$FIRST_TARGET" "images-raw"
          tar -Scf images-raw.tar images-raw
          IMG_TAR="$(realpath images-raw.tar)"

          # diff against the cached last known good images (if exists)
          if [ ! -z "$CACHED_IMG" ]
          then
            mkdir -p cached
            pushd cached
              tar -Sxf "$CACHED_IMG"
            popd
            if "$DIFF_SCRIPT" images-raw cached/images-raw
            then
              RESULT=false
            fi
          fi

          # make VHDX images for Windows runners

          mv images-raw images-vhdx
          find images-vhdx -type f -iname '*.img' | while read img
          do
            vhdx_img="${img::-4}.vhdx"
            qemu-img convert -f raw -O vhdx "$img" "$vhdx_img"
            rm -f "$img"
          done
          tar -cf images-vhdx.tar images-vhdx
          VHDX_TAR="$(realpath images-vhdx.tar)"
        popd

        mv "$IMG_TAR" .
        mv "$VHDX_TAR" .
        echo "result=$RESULT" >> "$GITHUB_OUTPUT"

    # Always upload these for diagnosis.
    - name: Upload consolidated raw images
      uses: actions/upload-artifact@v7
      with:
        name: images-raw.tar
        path: images-raw.tar
    - name: Upload VHDX images
      uses: actions/upload-artifact@v7
      with:
        name: images-vhdx.tar
        path: images-vhdx.tar

  test-windows-interop:
    name: Test generated large sparse images on Windows runners
    needs: check-images
    if: needs.check-images.outputs.mkfs_differ == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: images-vhdx.tar
    - shell: bash
      run: |
        set -e

        tar -C /c -xf images-vhdx.tar

        for img in "/c/images-vhdx"/*/*/*.vhdx
        do
          img="$(echo "$img" | tr '/' '\\')"
          img="C:\\${img:3}"

          # mount the image and get the disk number assigned by the kernel
          disknum=$(powershell "Mount-DiskImage \"$img\" | Select-Object -ExpandProperty Number")
          # run chkdsk /f ...
          powershell "Get-Partition -DiskNumber $disknum -PartitionNumber 1 | Repair-Volume -OfflineScanAndFix"
          # dump some info
          powershell "Get-DiskImage \"$img\""
          # unmount the image
          powershell "Dismount-DiskImage \"$img\"" > /dev/null
        done

  cache-good-images:
    name: Cache last known good images
    needs: test-windows-interop
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: images-raw.tar
    - run: mv images-raw.tar images-raw.cached.tar
    - uses: actions/cache/save@v6
      with:
        path: images-raw.cached.tar
        key: images-raw.cached.tar-${{ github.run_id }}
